# Docker Compose service for the career-architect MCP server, following the powarr-mcp / lastfm-mcp pattern
# (a locally built image on postgres_net that Obot reaches as a remote MCP server), with tighter limits.
#
# Layout on the host:
#   /mnt/ServerFiles/Docker/composeFiles/career-architect-mcp/
#     docker-compose.yaml     <- this file
#     .env                    <- CAREER_MCP_TOKEN=<openssl rand -hex 32>   (mode 600; never commit it)
#     src/                    <- a clone of https://github.com/ConniptionFit/career-architect
#
# Start / update:   git -C src pull --ff-only && docker compose up -d --build
# Obot remote URL:  http://career-architect-mcp:8080/mcp   plus the header  X-Career-Token: <the same token>
services:
  career-architect-mcp:
    build:
      context: ./src
      dockerfile: mcp-server/Dockerfile
    image: career-architect-mcp:local
    container_name: career-architect-mcp
    restart: unless-stopped
    environment:
      CAREER_MCP_TOKEN: ${CAREER_MCP_TOKEN:?set CAREER_MCP_TOKEN in .env (openssl rand -hex 32)}
      CAREER_MCP_ALLOWED_HOSTS: career-architect-mcp:8080
      LOG_LEVEL: WARNING
    networks:
      - postgres_net
    # No published ports: only containers on the network reach it. The service holds no data and writes nothing.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    labels:
      autoheal: "true"

networks:
  postgres_net:
    external: true
    name: postgres_net
